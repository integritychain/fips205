[package]
name = "fips205-dudect"
version = "0.5.0"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
description = "Dudect testbench for FIPS 205 SLH-DSA"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
# MSRV set at 1.85 for Debian stable (trixie), e.g. https://packages.debian.org/trixie/rustc
rust-version = "1.85"


[dependencies]
fips205 = { path = ".." }
dudect-bencher = "0.6"
rand_core = { version = "0.6.4", default-features = false }


[profile.release]
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
