workspace = { members = ['ffi'], exclude = ["dudect", "fuzz", "wasm"] }

[package]
name = "fips205"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "FIPS 205: Stateless Hash-Based Digital Signature Standard"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
documentation = "https://docs.rs/fips205"
categories = ["cryptography", "no-std"]
keywords = ["FIPS", "FIPS205", "hash", "signature"]
repository = "https://github.com/integritychain/fips205"
# MSRV set at 1.85 for Debian stable (trixie), e.g. https://packages.debian.org/trixie/rustc
rust-version = "1.85"


[dependencies]
zeroize = { version = "1.6.0", default-features = false, features = ["zeroize_derive"] }
rand_core = { version = "0.6.4", default-features = false }
sha3 = { version = "0.10.2", default-features = false }
sha2 = { version = "0.10.8", default-features = false }


[dev-dependencies]
# The crate itself, so that every `cargo test` has the NIST hooks. `cargo package` drops this line.
fips205 = { path = ".", default-features = false, features = ["acvp-internal"] }
rand_chacha = "0.3.1"
hex = "0.4.3"
criterion = "0.5"
# Direct pin: Cargo.lock is gitignored; textwrap>=0.16.3 raises MSRV above 1.85
textwrap = "=0.16.2"
serde_json = "1.0"
flate2 = "1.0.27"

[features]
default = ["default-rng", "slh_dsa_sha2_128s", "slh_dsa_shake_128s", "slh_dsa_sha2_128f", "slh_dsa_shake_128f",
    "slh_dsa_sha2_192s", "slh_dsa_shake_192s", "slh_dsa_sha2_192f", "slh_dsa_shake_192f",
    "slh_dsa_sha2_256s", "slh_dsa_shake_256s", "slh_dsa_sha2_256f", "slh_dsa_shake_256f"]
default-rng = ["rand_core/getrandom"]
slh_dsa_sha2_128s = []
slh_dsa_shake_128s = []
slh_dsa_sha2_128f = []
slh_dsa_shake_128f = []
slh_dsa_sha2_192s = []
slh_dsa_shake_192s = []
slh_dsa_sha2_192f = []
slh_dsa_shake_192f = []
slh_dsa_sha2_256s = []
slh_dsa_shake_256s = []
slh_dsa_sha2_256f = []
slh_dsa_shake_256f = []
# Test hook only; not for use in applications.
# `acvp-internal` lets the NIST tests apply every vector. The tests turn it on above.
acvp-internal = []


[[bench]]
name = "benchmark"
harness = false


[profile.dev]
opt-level = 3


[profile.bench]
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
